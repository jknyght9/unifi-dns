<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="unifi-dns">
  <!-- A DNS delegation glyph: one authority resolving to several answers.
       Deliberately not a stylised "U" with a letter bolted on. Ubiquiti's UniFi
       logo is itself a stylised U, so that shape would read as affiliation
       rather than as an independent tool. Two leaves rather than three because
       three merge into a blur at 16px. -->
  <rect width="32" height="32" rx="7" fill="#006FFF"/>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M9.5 16h4.5"/>
    <path d="M14 16c4 0 3.5-6.5 7.5-6.5"/>
    <path d="M14 16c4 0 3.5 6.5 7.5 6.5"/>
  </g>
  <g fill="#fff">
    <circle cx="9" cy="16" r="3.4"/>
    <circle cx="22.5" cy="9.5" r="3"/>
    <circle cx="22.5" cy="22.5" r="3"/>
  </g>
</svg>
